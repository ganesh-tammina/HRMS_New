<div class="login-wrapper">
    <!-- LEFT SECTION -->
    <div class="login-left">
        <img src="../../assets/login-image-background.svg" alt="Dashboard Illustration" />
    </div>

    <!-- RIGHT SECTION -->
    <div class="login-right">
        <div class="login-card">
            <div class="logo">
                <img src="../../assets/techtammina.webp" alt="Tech Tammina Logo" />
            </div>

            <h2>Log into your account</h2>

            <form>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter your email" required />
                </div>
                <div class="form-group">
                    <label>Passwqord</label>
                    <input type="password" placeholder="Enter your password" required />
                </div>

                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-primary" (click)="onLogin()">Login</button>
            </form>
        </div>
    </div>
</div>
